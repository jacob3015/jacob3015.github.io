<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="게임 개발에 필요한 세계관, 아트, 오디오, 서사, 메커닉 등 종합 예술 리소스를 웹 표준 기술로 프로토타이핑하고 아카이빙하는 플레이어블 리소스 랩">

    <!-- favicons -->
    <link rel="icon" href="./assets/img/icons/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="./assets/img/icons/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="./assets/img/icons/favicon.ico" sizes="48x48" type="image/x-icon">
    <link rel="manifest" href="./assets/img/icons/site.webmanifest">
    <link rel="apple-touch-icon" href="./assets/img/icons/apple-touch-icon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/showcase.css">

    <!-- Web Components & Application Scripts -->
    <script type="module" src="./assets/js/site-components.js"></script>
    <script type="module" src="./assets/js/showcase.js"></script>

    <title>Jacob's Interactive Game Lab</title>
</head>
<body>
    <site-header></site-header>

    <main class="container">
        <!-- Hero & Profile Section -->
        <section class="hero">
            <div class="hero-badges">
                <span class="badge">Pure Web Standards</span>
                <span class="badge" style="background-color: var(--accent-subtle); color: var(--accent-primary);">Game Resource Lab</span>
                <span class="badge" style="background-color: rgba(16, 185, 129, 0.12); color: #059669;">Playable Prototypes</span>
            </div>

            <h1 class="hero-title">Jacob's Interactive Game Lab</h1>
            <p class="hero-description">
                게임 개발에 필요한 세계관, 아트, 사운드, 시나리오, 인터랙티브 시스템 등 종합 예술 리소스를
                웹 표준 기술로 프로토타이핑하고 아카이빙하는 플레이어블 리소스 랩입니다.
            </p>

            <div class="hero-profile">
                <div class="profile-avatar">J</div>
                <div class="profile-info">
                    <h3>Jacob (Jaimin Pak)</h3>
                    <p>Game Creator & Tech Explorer • Vanilla Web Standards, Game Mechanics</p>
                </div>
            </div>
        </section>

        <!-- Controls: Filters & Search -->
        <section class="controls-bar" aria-label="게임 리소스 검색 및 필터">
            <div class="category-filters" id="category-filters" role="tablist">
                <!-- Dynamically populated by showcase.js -->
            </div>

            <div style="display: flex; align-items: center; gap: var(--space-md); justify-content: space-between;">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="search-input" class="search-input" placeholder="세계관, 스프라이트, 사운드, 메커닉 검색..." aria-label="게임 리소스 검색">
                    <kbd class="search-kbd" title="검색 단축키">/</kbd>
                </div>
                <span class="posts-count" id="posts-count">0 resources</span>
            </div>
        </section>

        <!-- Interactive Posts Grid -->
        <section class="posts-grid" id="posts-grid" aria-live="polite">
            <!-- Dynamically populated by showcase.js -->
        </section>
    </main>

    <site-footer></site-footer>
</body>
</html>
