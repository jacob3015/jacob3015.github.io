<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Astrolabe / Sacred Geometry Rings -->
  <g transform="translate(400, 225)" opacity="0.35">
    <circle r="170" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="4,8" />
    <circle r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle r="100" fill="none" stroke="url(#cyanGrad)" stroke-width="1" stroke-dasharray="2,4" />
    <polygon points="0,-140 121,70 -121,70" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5" />
    <polygon points="0,140 121,-70 -121,-70" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" />
  </g>

  <!-- Timeline Line & Nodes -->
  <g transform="translate(0, 225)">
    <!-- Main Horizontal Timeline -->
    <line x1="120" y1="0" x2="680" y2="0" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Node 1: Primitive / Hunting -->
    <g transform="translate(180, 0)">
      <circle r="22" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#glow)" />
      <circle r="8" fill="#10b981" />
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">원시 수렵</text>
      <text x="0" y="-36" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ERA I</text>
    </g>

    <!-- Node 2: Metallurgy / Settlement -->
    <g transform="translate(320, 0)">
      <circle r="22" fill="#0f172a" stroke="#f59e0b" stroke-width="3" filter="url(#glow)" />
      <circle r="8" fill="#f59e0b" />
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">문명 태동</text>
      <text x="0" y="-36" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ERA II</text>
    </g>

    <!-- Node 3: Trade / Alchemy -->
    <g transform="translate(480, 0)">
      <circle r="22" fill="#0f172a" stroke="#06b6d4" stroke-width="3" filter="url(#glow)" />
      <circle r="8" fill="#06b6d4" />
      <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">도시 교역</text>
      <text x="0" y="-36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ERA III</text>
    </g>

    <!-- Node 4: 3D RPG Climax -->
    <g transform="translate(620, 0)">
      <polygon points="0,-26 24,18 -24,18" fill="#0f172a" stroke="#a855f7" stroke-width="3" filter="url(#glow)" />
      <circle r="6" fill="#c084fc" cy="2" />
      <text x="0" y="48" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3D 판타지 RPG</text>
      <text x="0" y="-36" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DESTINATION</text>
    </g>
  </g>

  <!-- Title Badge on Top -->
  <g transform="translate(400, 70)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5" />
    <text x="0" y="5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">CHRONICLES OF GENESIS</text>
  </g>

  <!-- Bottom Subtitle -->
  <text x="400" y="405" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5" text-anchor="middle">
    문명사 6대 시스템 기반의 연대기적 세계관 아카이브 &amp; 시뮬레이션 매트릭스
  </text>
</svg>
