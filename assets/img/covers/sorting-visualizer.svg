<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bar-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="bar-grad-active" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="bar-grad-sorted" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid lines -->
  <line x1="60" y1="280" x2="540" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  <line x1="60" y1="200" x2="540" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  <line x1="60" y1="120" x2="540" y2="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />

  <!-- Sorting Bars Visualization -->
  <!-- Sorted (Green) -->
  <rect x="75" y="240" width="32" height="40" rx="4" fill="url(#bar-grad-sorted)" />
  <rect x="117" y="210" width="32" height="70" rx="4" fill="url(#bar-grad-sorted)" />
  <rect x="159" y="170" width="32" height="110" rx="4" fill="url(#bar-grad-sorted)" />

  <!-- Active / Comparing (Amber) -->
  <rect x="201" y="100" width="32" height="180" rx="4" fill="url(#bar-grad-active)" />
  <rect x="243" y="130" width="32" height="150" rx="4" fill="url(#bar-grad-active)" />

  <!-- Unsorted (Blue) -->
  <rect x="285" y="80" width="32" height="200" rx="4" fill="url(#bar-grad-1)" />
  <rect x="327" y="190" width="32" height="90" rx="4" fill="url(#bar-grad-1)" />
  <rect x="369" y="110" width="32" height="170" rx="4" fill="url(#bar-grad-1)" />
  <rect x="411" y="230" width="32" height="50" rx="4" fill="url(#bar-grad-1)" />
  <rect x="453" y="150" width="32" height="130" rx="4" fill="url(#bar-grad-1)" />
  <rect x="495" y="90" width="32" height="190" rx="4" fill="url(#bar-grad-1)" />

  <!-- Label Badge -->
  <rect x="75" y="45" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <circle cx="90" cy="59" r="4" fill="#fbbf24" />
  <text x="104" y="64" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">SORTING DEMO</text>
</svg>
