<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="caveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1613" />
      <stop offset="45%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="fireGlow" cx="30%" cy="70%" r="45%">
      <stop offset="0%" stop-color="rgba(249, 115, 22, 0.45)" />
      <stop offset="60%" stop-color="rgba(180, 83, 9, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    <radialGradient id="magicGlow" cx="72%" cy="48%" r="45%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.5)" />
      <stop offset="50%" stop-color="rgba(168, 85, 247, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cave Stone Background -->
  <rect width="800" height="450" fill="url(#caveBg)" />
  <rect width="800" height="450" fill="url(#fireGlow)" />
  <rect width="800" height="450" fill="url(#magicGlow)" />

  <!-- Subtle Cave Cracks Texture -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1.5" fill="none">
    <path d="M0,120 Q180,150 320,90 T650,140 L800,110" />
    <path d="M80,0 Q120,200 60,340 T150,450" />
    <path d="M520,0 Q480,180 550,310 T490,450" />
  </g>

  <!-- LEFT: Primal Charcoal & Ochre Cave Mural (Fear & Survival) -->
  <g transform="translate(80, 140)" opacity="0.88">
    <!-- Prehistoric Beast (Mammoth/Behemoth Silhouette in Ochre & Charcoal) -->
    <path d="M40,140 Q35,80 85,65 Q135,50 175,80 Q200,95 205,135 L190,180 L170,180 L165,145 L115,145 L110,180 L85,180 L85,140 Z"
          fill="rgba(154, 52, 18, 0.35)" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
    <!-- Curved Tusks -->
    <path d="M45,115 Q10,125 5,95 Q20,105 48,105" fill="none" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round" />
    <!-- Primitive Stick Hunters with Spears -->
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <circle cx="235" cy="135" r="5" fill="#f59e0b" />
      <line x1="235" y1="140" x2="230" y2="165" />
      <line x1="230" y1="165" x2="220" y2="185" />
      <line x1="230" y1="165" x2="242" y2="185" />
      <line x1="210" y1="145" x2="255" y2="125" stroke="#fde68a" stroke-width="2" />
    </g>
    <!-- Primal Campfire -->
    <g transform="translate(130, 215)">
      <path d="M-20,10 L20,0 M-18,0 L22,10" stroke="#78350f" stroke-width="4" stroke-linecap="round" />
      <path d="M0,-28 Q14,-8 8,4 Q0,12 -8,4 Q-14,-8 0,-28 Z" fill="#f97316" filter="url(#neonGlow)" />
      <path d="M0,-18 Q8,-5 4,2 Q0,7 -4,2 Q-8,-5 0,-18 Z" fill="#fde047" />
    </g>
    <text x="130" y="255" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      I. 화식과 수렵의 시대 (목탄 · 황토)
    </text>
  </g>

  <!-- CENTER: Journey Path Transition -->
  <path d="M310,275 C370,275 410,195 470,195" fill="none" stroke="url(#runeGrad)" stroke-width="3" stroke-dasharray="6,6" filter="url(#neonGlow)" />

  <!-- RIGHT: Discovery of Magic (Glowing Mana Crystal & First Runes) -->
  <g transform="translate(575, 215)">
    <!-- Sacred Geometry & Rune Circle -->
    <circle r="95" fill="none" stroke="url(#runeGrad)" stroke-width="2" stroke-dasharray="8,6" opacity="0.7" filter="url(#neonGlow)" />
    <circle r="72" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.5" />

    <!-- Glowing Mana Crystal Monolith -->
    <polygon points="0,-65 28,-15 18,48 -18,48 -28,-15" fill="rgba(6, 182, 212, 0.25)" stroke="#22d3ee" stroke-width="3" filter="url(#neonGlow)" />
    <polygon points="0,-65 0,48 28,-15" fill="rgba(168, 85, 247, 0.25)" />
    <polyline points="-18,-10 0,-35 16,-8 0,25 -18,-10" fill="none" stroke="#e0f2fe" stroke-width="2" />

    <!-- Floating Rune Glyphs -->
    <g stroke="#22d3ee" stroke-width="2.2" fill="none" filter="url(#neonGlow)">
      <path d="M-65,-40 L-50,-55 L-50,-25 L-65,-40 M-50,-40 L-40,-40" />
      <path d="M55,-45 L70,-30 M70,-45 L55,-30 M62,-52 L62,-22" />
      <path d="M-60,35 L-45,20 L-35,35 L-50,50 Z" stroke="#c084fc" />
      <path d="M50,35 Q65,15 75,35 Q65,55 50,35 Z" stroke="#fbbf24" />
    </g>

    <text x="0" y="140" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      II. 마법의 발견과 각성 (에테르 · 태초의 룬)
    </text>
  </g>

  <!-- Top Header Badge -->
  <g transform="translate(400, 55)">
    <rect x="-210" y="-18" width="420" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 211, 238, 0.5)" stroke-width="1.5" />
    <text x="0" y="5" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      PRIMAL ODYSSEY &amp; DAWN OF MAGIC
    </text>
  </g>

  <!-- Bottom Caption -->
  <text x="400" y="420" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">
    원시 부족의 대이동 여정 · 동굴 벽화 색채 연출 시뮬레이터 · 태고의 소리 &amp; 마법 공명 오디오 랩
  </text>
</svg>
