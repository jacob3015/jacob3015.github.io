<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!-- Favicons -->
    <link rel="icon" href="/assets/img/icons/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="/assets/img/icons/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/assets/img/icons/favicon.ico" sizes="48x48" type="image/x-icon">
    <link rel="manifest" href="/assets/img/icons/site.webmanifest">
    <link rel="apple-touch-icon" href="/assets/img/icons/apple-touch-icon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/global.css">

    <!-- Web Components -->
    <script type="module" src="/assets/js/site-components.js"></script>

    <title>404 Page Not Found | Jacob's Novel Drill</title>

    <style>
      .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 65vh;
        padding: var(--space-3xl) var(--space-md);
      }

      .error-code {
        font-family: var(--font-serif);
        font-size: clamp(4.5rem, 12vw, 7rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--text-primary);
        margin-block-end: var(--space-sm);
      }

      .error-title {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        font-weight: 700;
        margin-block-end: var(--space-xs);
      }

      .error-desc {
        max-width: 44ch;
        color: var(--text-secondary);
        font-size: 1rem;
        margin-block-end: var(--space-xl);
      }
    </style>
</head>
<body>
    <site-header></site-header>

    <main class="container">
        <section class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">찾으시는 원고나 훈련 기록이 없습니다</h1>
            <p class="error-desc">
                요청하신 페이지의 주소가 변경되었거나 삭제되었을 수 있습니다. 아카이브 홈으로 이동해 다른 훈련 기록을 확인해 보세요.
            </p>
            <div style="display: flex; gap: var(--space-sm);">
                <a href="/" class="btn btn-primary">아카이브 홈으로</a>
                <a href="https://github.com/jacob3015/jacob3015.github.io" target="_blank" rel="noopener noreferrer" class="btn btn-outline">GitHub 저장소</a>
            </div>
        </section>
    </main>

    <site-footer></site-footer>
</body>
</html>
